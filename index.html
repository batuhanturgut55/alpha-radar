<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPHA RADAR | Canlı Kelepir & İhale Vitrini</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "JetBrains Mono", monospace; background-color: #080c14; color: #f3f4f6; }
    .card-border { border: 1px solid rgba(16, 185, 129, 0.25); background: #0f172a; }
    .card-border:hover { border-color: rgba(16, 185, 129, 0.7); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between">

  <div>
    <!-- Üst Bar -->
    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-5 gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="inline-block w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-white">ALPHA RADAR</h1>
          <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded font-bold">CANLI VİTRİN</span>
        </div>
        <p class="text-xs text-gray-400 mt-1">İcra, Kamu, Sahibinden, Arabam ve Emlakjet Kelepir Havuzu</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetRejected()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded border border-gray-700 transition">
          🗑️ Pas Geçilenleri Sıfırla (<span id="rejCount">0</span>)
        </button>
        <button onclick="fetchLatestPool()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded font-bold transition flex items-center gap-1.5">
          🔄 Anlık Veri Çek
        </button>
      </div>
    </header>

    <!-- Sayaç / İstatistik -->
    <div class="max-w-7xl mx-auto mb-6 grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
      <div class="bg-slate-900 p-3 rounded border border-gray-800">
        <span class="text-gray-500 block">VİTRİNDEKİ İLAN</span>
        <span id="statVisible" class="text-lg font-bold text-emerald-400">0 / 6</span>
      </div>
      <div class="bg-slate-900 p-3 rounded border border-gray-800">
        <span class="text-gray-500 block">TOPLAM HAVUZ</span>
        <span id="statPool" class="text-lg font-bold text-white">0</span>
      </div>
      <div class="bg-slate-900 p-3 rounded border border-gray-800">
        <span class="text-gray-500 block">YEDEKTE BEKLEYEN</span>
        <span id="statWaiting" class="text-lg font-bold text-blue-400">0</span>
      </div>
      <div class="bg-slate-900 p-3 rounded border border-gray-800">
        <span class="text-gray-500 block">SON GÜNCELLEME</span>
        <span id="statTime" class="text-lg font-bold text-gray-300">Bağlanıyor...</span>
      </div>
    </div>

    <!-- 6 Kartlık Sabit Vitrin Izgarası -->
    <main class="max-w-7xl mx-auto">
      <div id="gridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full py-20 text-center text-gray-500 animate-pulse">
          Canlı istihbarat havuzundan güncel ilanlar çekiliyor...
        </div>
      </div>
    </main>
  </div>

  <footer class="max-w-7xl mx-auto mt-12 py-4 border-t border-gray-800/80 text-center text-xs text-gray-600 w-full">
    Alpha Radar Otonom İstihbarat Ağı • Kesintisiz Canlı Veri Akışı
  </footer>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/batuhanturgut55/alpha-radar/main/data.json";
    const VISIBLE_COUNT = 6; // Ekranda daima sabit 6 kart duracak
    let masterPool = [];

    function getRejected() {
      try {
        return JSON.parse(localStorage.getItem("alpha_rejected_ids") || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveRejected(arr) {
      localStorage.setItem("alpha_rejected_ids", JSON.stringify(arr));
      document.getElementById("rejCount").innerText = arr.length;
    }

    function resetRejected() {
      if (confirm("Pas geçtiğin tüm ilanları vitrine geri döndürmek istiyor musun?")) {
        localStorage.removeItem("alpha_rejected_ids");
        saveRejected([]);
        renderSlots();
      }
    }

    // Bir ilanı pas geçince hemen yedekten sıradaki gelir
    function passItem(adId) {
      const rej = getRejected();
      if (!rej.includes(adId)) {
        rej.push(adId);
        saveRejected(rej);
      }
      renderSlots();
    }

    async function fetchLatestPool() {
      try {
        document.getElementById("statTime").innerText = "Güncelleniyor...";
        // GitHub CDN ve tarayıcı önbelleğini kıran sorgu
        const res = await fetch(DATA_URL + "?v=" + Date.now(), {
          cache: "no-store",
          headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        masterPool = await res.json();
        
        document.getElementById("statTime").innerText = new Date().toLocaleTimeString("tr-TR");
        renderSlots();
      } catch (err) {
        console.error(err);
        document.getElementById("statTime").innerText = "Bağlantı Hatası";
      }
    }

    function renderSlots() {
      const rejected = getRejected();
      // Pas geçilmemiş tüm aktif havuz
      const availablePool = masterPool.filter(item => !rejected.includes(item.id));

      // Ekrana sadece ilk 6 tanesi basılacak
      const visibleItems = availablePool.slice(0, VISIBLE_COUNT);
      const waitingCount = Math.max(0, availablePool.length - VISIBLE_COUNT);

      document.getElementById("statVisible").innerText = visibleItems.length + " / " + VISIBLE_COUNT;
      document.getElementById("statPool").innerText = masterPool.length;
      document.getElementById("statWaiting").innerText = waitingCount;
      document.getElementById("rejCount").innerText = rejected.length;

      const container = document.getElementById("gridContainer");

      if (visibleItems.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center bg-slate-900/60 border border-gray-800 rounded-xl p-8">
            <div class="text-4xl mb-3">🎯</div>
            <div class="text-lg font-bold text-white mb-2">Gösterilecek Yeni İlan Kalmadı</div>
            <p class="text-xs text-gray-400 mb-5">Havuzdaki tüm mevcut ilanları pas geçtiniz. Yeni tarama bekleniyor veya sıfırlayabilirsiniz.</p>
            <button onclick="resetRejected()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded transition">
              Pas Geçilenleri Geri Getir
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = visibleItems.map(item => `
        <div class="card-border rounded-xl p-5 flex flex-col justify-between transition relative group">
          <div>
            <!-- Üst Başlık & Rozetler -->
            <div class="flex justify-between items-start mb-3 gap-2">
              <span class="text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-200 font-bold border border-gray-700 flex items-center gap-1.5">
                <span>${item.categoryIcon || "📦"}</span>
                <span>${item.categoryName || "Fırsat Varlığı"}</span>
              </span>
              <span class="text-[11px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-bold border border-emerald-800">
                ${item.badge || item.urgencyTag || "⚡ FIRSAT"}
              </span>
            </div>

            <!-- İlan Başlığı -->
            <h2 class="text-sm font-bold text-white line-clamp-2 mb-2 group-hover:text-emerald-400 transition" title="${item.title}">
              ${item.title}
            </h2>

            <!-- Konum & Kurum -->
            <div class="text-xs text-gray-400 mb-4 flex items-center gap-1.5">
              <span>📍</span>
              <span class="font-semibold text-gray-200">${item.city || "Türkiye"}</span>
              <span class="text-gray-600">•</span>
              <span class="truncate text-gray-400">${item.district || item.source || "Resmi Satış"}</span>
            </div>

            <!-- Fiyat Kutusu -->
            <div class="bg-black/50 rounded-lg p-3 border border-gray-800/80 mb-4 space-y-1.5 text-xs">
              <div class="flex justify-between text-gray-400">
                <span>Piyasa / Muhammen:</span>
                <span class="text-gray-300 font-semibold line-through">₺${(item.marketPrice || 0).toLocaleString("tr-TR")}</span>
              </div>
              <div class="flex justify-between text-white font-bold">
                <span>Fırsat Teklifi:</span>
                <span class="text-emerald-400 text-sm">₺${(item.offerPrice || 0).toLocaleString("tr-TR")}</span>
              </div>
              <div class="flex justify-between text-gray-400 pt-1 border-t border-gray-800">
                <span>Tahmini Net Marj:</span>
                <span class="text-blue-400 font-bold">+₺${(item.estimatedProfit || 0).toLocaleString("tr-TR")}</span>
              </div>
            </div>

            <p class="text-[11px] text-gray-400 italic mb-4 line-clamp-2">
              🤖 "${item.aiAnalysis || item.tramerLegal || "Canlı istihbarat kaydı."}"
            </p>
          </div>

          <!-- Aksiyon Butonları -->
          <div class="flex items-center gap-2 pt-3 border-t border-gray-800/80">
            <a href="${item.sourceUrl || "#"}" target="_blank" rel="noopener noreferrer" 
               class="flex-1 text-center py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold text-xs transition">
              🔗 İlana Git
            </a>
            <button onclick="passItem('${item.id}')" title="Bu ilanı pas geç ve yerine yedekteki ilanı getir"
                    class="px-3.5 py-2.5 bg-gray-800 hover:bg-rose-950 hover:text-rose-400 hover:border-rose-800 text-gray-400 border border-gray-700 rounded text-xs font-bold transition flex items-center justify-center gap-1.5">
              <span>✕</span>
              <span>Pas Geç</span>
            </button>
          </div>
        </div>
      `).join("");
    }

    // Başlat
    saveRejected(getRejected());
    fetchLatestPool();
    // 30 saniyede bir arkadaki güncellemeleri otomatik süz
    setInterval(fetchLatestPool, 30000);
  </script>
</body>
</html>
