<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPHA RADAR — Finansal İstihbarat & Varlık Havuzu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { background-color: #090B0E; color: #E5E7EB; font-family: system-ui, -apple-system, sans-serif; }
    .item-card { transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.08); background: #10141A; }
    .item-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
    .leaflet-container { background: #090B0E; }
    .leaflet-tile-pane { filter: brightness(0.65) invert(1) contrast(3.2) hue-rotate(200deg) saturate(0.25); }
    .leaflet-popup-content-wrapper { background: #10141A !important; color: #F3F4F6 !important; border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-white/10 bg-[#090B0E]/90 sticky top-0 z-50 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">α</div>
        <div>
          <h1 class="text-sm font-bold text-white uppercase tracking-wider">Alpha Radar</h1>
          <p class="text-[11px] text-neutral-400">İcra, Kamu & Serbest Piyasa Varlık Havuzu</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <input type="text" id="searchInput" oninput="render()" placeholder="Şehir, marka, esas..." class="bg-neutral-900 border border-white/10 rounded px-2.5 py-1 text-xs text-white focus:outline-none focus:border-emerald-500">
        <select id="channelFilter" onchange="render()" class="bg-neutral-900 border border-white/10 text-neutral-300 text-xs rounded px-2 py-1">
          <option value="all">Tüm Kaynaklar</option>
          <option value="icra">UYAP / Kamu</option>
          <option value="piyasa">Serbest Piyasa</option>
        </select>
        <button onclick="loadData()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1 rounded">Yenile</button>
      </div>
    </div>
  </header>

  <div class="border-b border-white/5 bg-neutral-950/60 px-4 py-2 text-xs font-mono">
    <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div><span class="text-neutral-500">HAVUZ:</span> <span id="statTotal" class="text-white font-bold">0</span></div>
        <div><span class="text-neutral-500">LİSTELENEN:</span> <span id="statVisible" class="text-emerald-400 font-bold">0</span></div>
        <div><span class="text-neutral-500">DURUM:</span> <span id="statSync" class="text-emerald-400 font-bold">Bağlanıyor...</span></div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="setCategory('all')" id="btn-all" class="px-2 py-0.5 rounded text-xs bg-neutral-800 text-white">Tümü</button>
        <button onclick="setCategory('automotive')" id="btn-automotive" class="px-2 py-0.5 rounded text-xs text-neutral-400">Vasıta</button>
        <button onclick="setCategory('land')" id="btn-land" class="px-2 py-0.5 rounded text-xs text-neutral-400">Tarla</button>
        <button onclick="setCategory('realestate')" id="btn-realestate" class="px-2 py-0.5 rounded text-xs text-neutral-400">Emlak</button>
      </div>
    </div>
  </div>

  <section class="max-w-6xl mx-auto px-4 pt-4 w-full">
    <div class="border border-white/10 rounded-lg overflow-hidden relative" style="height: 260px;">
      <div id="radarMap" style="height: 100%; width: 100%;"></div>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="feedContainer" class="space-y-3">
      <div class="text-center text-xs text-neutral-500 py-10 font-mono">Veriler taranıyor...</div>
    </div>
  </main>

  <script>
    let pool = [];
    let currentCategory = 'all';
    let map = null;
    let markersLayer = null;

    function initMap() {
      try {
        if (map) return;
        map = L.map('radarMap', { zoomControl: false }).setView([39.0, 35.2], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      } catch(e) { console.error('Map init error:', e); }
    }

    function updateMarkers(items) {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();
      items.forEach((it, idx) => {
        let lat = Number(it.lat) || (39.0 + (idx % 8) * 0.05);
        let lng = Number(it.lng) || (35.0 + (idx % 8) * 0.05);
        let color = it.category === 'automotive' ? '#38bdf8' : (it.category === 'realestate' ? '#f97316' : '#10b981');
        const iconHtml = `<div style="background:#10141A; border:2px solid ${color}; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:12px;">${it.categoryIcon || '📦'}</div>`;
        const cIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });
        
        const popup = `<div style="font-size:12px;"><b>${it.title || 'İlan'}</b><br><span style="color:${color}">${it.city || 'TR'}</span><br>Fırsat: ₺${Number(it.offerPrice||0).toLocaleString('tr-TR')}<br><a href="${it.sourceUrl || '#'}" target="_blank" style="color:#10b981; font-weight:bold;">İlana Git ↗</a></div>`;
        L.marker([lat, lng], { icon: cIcon }).bindPopup(popup).addTo(markersLayer);
      });
    }

    function setCategory(cat) {
      currentCategory = cat;
      ['all', 'automotive', 'land', 'realestate'].forEach(c => {
        const el = document.getElementById('btn-' + c);
        if (el) el.className = c === cat ? 'px-2 py-0.5 rounded text-xs bg-neutral-800 text-white' : 'px-2 py-0.5 rounded text-xs text-neutral-400';
      });
      render();
    }

    function render() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const chan = document.getElementById('channelFilter')?.value || 'all';

      let list = pool.filter(it => {
        if (!it) return false;
        if (currentCategory !== 'all' && it.category !== currentCategory) return false;
        if (chan !== 'all' && (it.channel || 'icra') !== chan) return false;
        if (q) {
          const t = `${it.title || ''} ${it.city || ''} ${it.district || ''} ${it.docketNo || ''}`.toLowerCase();
          if (!t.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('statTotal').innerText = pool.length;
      document.getElementById('statVisible').innerText = list.length;
      updateMarkers(list);

      const cont = document.getElementById('feedContainer');
      if (!list.length) {
        cont.innerHTML = '<div class="text-center text-xs text-neutral-500 py-12 font-mono">Eşleşen ilan bulunamadı.</div>';
        return;
      }

      cont.innerHTML = list.map(it => {
        const market = Number(it.marketPrice || 0).toLocaleString('tr-TR');
        const offer = Number(it.offerPrice || 0).toLocaleString('tr-TR');
        const profit = Number(it.estimatedProfit || 0).toLocaleString('tr-TR');
        return `
          <div class="item-card rounded-lg p-3.5 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <div class="w-9 h-9 rounded bg-neutral-900 border border-white/10 flex items-center justify-center text-base shrink-0">${it.categoryIcon || '📦'}</div>
              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-2 mb-1 text-[11px] font-mono">
                  <span class="text-emerald-400 border border-emerald-500/30 bg-emerald-500/10 px-1.5 py-0.5 rounded">${it.badge || 'FIRSAT'}</span>
                  <span class="text-neutral-500">${it.docketNo || it.id || ''}</span>
                  <span class="text-neutral-400 font-bold">${it.city || 'TR'} / ${it.district || 'Merkez'}</span>
                </div>
                <h2 class="text-sm font-semibold text-white truncate"><a href="${it.sourceUrl || '#'}" target="_blank" class="hover:text-emerald-400">${it.title || 'İlan'}</a></h2>
                <p class="text-xs text-neutral-400 truncate">${it.aiAnalysis || 'Açık ihale / serbest piyasa kaydı.'}</p>
              </div>
            </div>
            <div class="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto font-mono shrink-0">
              <div class="text-left md:text-right">
                <div class="text-[10px] text-neutral-500 line-through">₺${market}</div>
                <div class="text-sm font-bold text-white">₺${offer}</div>
                <div class="text-[10px] text-emerald-400 font-semibold">+₺${profit} Marj</div>
              </div>
              <a href="${it.sourceUrl || '#'}" target="_blank" class="bg-white hover:bg-neutral-200 text-neutral-900 font-semibold text-xs px-3 py-1.5 rounded">İlana Git ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadData() {
      const sync = document.getElementById('statSync');
      if (sync) sync.innerText = 'Yükleniyor...';
      try {
        const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        pool = await res.json();
        if (sync) sync.innerText = 'Canlı (' + pool.length + ' İlan)';
        render();
      } catch(e) {
        if (sync) sync.innerText = 'Yükleme Hatası';
        console.error(e);
      }
    }

    initMap();
    loadData();
    setInterval(loadData, 25000);
  </script>
</body>
</html>
