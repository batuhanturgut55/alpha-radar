    function AlphaRadarApp() {
      const [activeTab, setActiveTab] = useState('radar');
      const [selectedCity, setSelectedCity] = useState('Tümü');
      const [selectedCategory, setSelectedCategory] = useState('Tümü');
      const [minDiscount, setMinDiscount] = useState(15);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedOpp, setSelectedOpp] = useState(null);
      const [toast, setToast] = useState(null);

      const [telemetry, setTelemetry] = useState({
        speed: 1840,
        activeProxies: 64,
        totalScannedToday: 48920,
        alertsDispatched: 27
      });

      const [calcForm, setCalcForm] = useState({
        title: 'Örnek Kelepir Araç / Arsa',
        buyPrice: 750000,
        marketValue: 920000,
        expenses: 25000,
        holdingMonths: 1.5
      });

      const [fireConfig, setFireConfig] = useState({
        startingCapital: 150000,
        monthlySavings: 35000,
        annualFlipYield: 45,
        years: 15
      });

      useEffect(() => {
        const timer = setInterval(() => {
          setTelemetry(prev => ({
            ...prev,
            speed: Math.floor(1750 + Math.random() * 250),
            totalScannedToday: prev.totalScannedToday + Math.floor(Math.random() * 6)
          }));
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const filteredOpportunities = useMemo(() => {
        return INITIAL_OPPORTUNITIES.filter(item => {
          const matchCity = selectedCity === 'Tümü' || item.city === selectedCity;
          const matchCategory = selectedCategory === 'Tümü' || item.category === selectedCategory;
          const matchDiscount = item.discountRate >= minDiscount;
          const matchSearch = searchQuery.trim() === '' || 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.district.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCity && matchCategory && matchDiscount && matchSearch;
        });
      }, [selectedCity, selectedCategory, minDiscount, searchQuery]);

      const calcOutput = useMemo(() => {
        const totalCost = Number(calcForm.buyPrice) + Number(calcForm.expenses);
        const netProfit = Number(calcForm.marketValue) - totalCost;
        const roi = totalCost > 0 ? ((netProfit / totalCost) * 100) : 0;
        const annualizedRoi = calcForm.holdingMonths > 0 ? (roi * (12 / calcForm.holdingMonths)).toFixed(0) : 0;

        let signal = 'AGRESİF AL';
        let badgeStyle = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
        let advice = 'Mükemmel kâr marjı. Nakit gücünü kullanarak satıcı ile hemen temasa geç.';

        if (roi < 12 || netProfit < 40000) {
          signal = 'LİKİDİTE RİSKİ / UZAK DUR';
          badgeStyle = 'bg-rose-500/20 text-rose-400 border-rose-500/40';
          advice = 'Marj bekleme ve operasyon masraflarını karşılamıyor. En az %15 ek indirim iste.';
        } else if (roi < 18) {
          signal = 'PAZARLIK ET';
          badgeStyle = 'bg-amber-500/20 text-amber-400 border-amber-500/40';
          advice = 'Fırsat var ancak kâr marjı sınırda. Peşin para kozuyla fiyatı biraz daha kırmaya çalış.';
        }

        return { totalCost, netProfit, roi: roi.toFixed(1), annualizedRoi, signal, badgeStyle, advice };
      }, [calcForm]);

      const fireTimeline = useMemo(() => {
        const list = [];
        let netWorth = Number(fireConfig.startingCapital);
        const monthlyReturn = Math.pow(1 + Number(fireConfig.annualFlipYield) / 100, 1 / 12) - 1;

        for (let yr = 0; yr <= fireConfig.years; yr++) {
          list.push({
            year: yr,
            age: 21 + yr,
            netWorth: Math.round(netWorth),
            monthlyPassive: Math.round((netWorth * 0.10) / 12)
          });
          for (let m = 0; m < 12; m++) {
            netWorth = (netWorth + Number(fireConfig.monthlySavings)) * (1 + monthlyReturn);
          }
        }
        return list;
      }, [fireConfig]);

                    <div>
                      <div className="flex justify-between text-[11px] font-mono mb-1">

                        <span className="text-emerald-400 font-bold">%{minDiscount} Altı</span>
                      </div>
                      <input

                        onChange={e => setMinDiscount(Number(e.target.value))}
                        className="w-full accent-emerald-500 cursor-pointer mt-1" 
                      />
                    </div>

                    <div>
                      <label className="text-[11px] font-mono text-zinc-400 block mb-1">Anahtar Kelime Ara</label>
                      <input 
                        type="text" 
                        value={searchQuery} 
                        onChange={e => setSearchQuery(e.target.value)}
                        placeholder="Vezirköprü, Megane, İcra..." 
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder:text-zinc-600 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>
                </div>

                {/* Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {filteredOpportunities.map(opp => (
                    <div key={opp.id} className="bg-[#0C111A] border border-zinc-800/80 hover:border-emerald-500/50 rounded-2xl p-5 transition flex flex-col justify-between shadow-lg">
                      <div>
                        <div className="flex justify-between items-center mb-3">
                          <div className="flex items-center gap-2">
                            <span className="text-base">{opp.categoryIcon}</span>
                            <span className="text-xs font-mono text-zinc-400">{opp.categoryName} • <strong className="text-slate-200">{opp.city} / {opp.district}</strong></span>
                          </div>
                          <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            -%{opp.discountRate}% İSKONTO
                          </span>
                        </div>

                        <h3 className="text-base font-bold text-white mb-3 line-clamp-1">{opp.title}</h3>

                        <div className="grid grid-cols-3 gap-2 bg-zinc-950/80 border border-zinc-850 rounded-xl p-3 font-mono text-center mb-3">
                          <div>
                            <span className="text-[10px] text-zinc-500 block">Piyasa Emsali</span>
                            <span className="text-xs text-zinc-400 line-through">₺{opp.marketPrice.toLocaleString('tr-TR')}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-zinc-500 block">Fırsat Alış</span>
                            <span className="text-sm font-bold text-white">₺{opp.offerPrice.toLocaleString('tr-TR')}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-zinc-500 block">Net Kâr Marjı</span>
                            <span className="text-sm font-bold text-emerald-400">+₺{opp.estimatedProfit.toLocaleString('tr-TR')}</span>
                          </div>
                        </div>

                        <div className="text-xs text-zinc-300 bg-zinc-900/50 border border-zinc-800/60 rounded-xl p-3 mb-4 space-y-1">
                          <p className="leading-relaxed"><strong className="text-emerald-400 font-mono">AI Analizi:</strong> {opp.aiAnalysis}</p>
                          <div className="flex justify-between text-[11px] font-mono text-zinc-400 pt-2 border-t border-zinc-800/60">
                            <span>Risk Skoru: <strong className="text-slate-200">{opp.riskScore}/10</strong></span>
                            <span>Döngü Süresi: <strong className="text-cyan-400">~{opp.turnaroundDays} Gün</strong></span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 pt-2 border-t border-zinc-800/60">
                        <button 
                          onClick={() => setSelectedOpp(opp)}
                          className="flex-1 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-slate-200 transition"
                        >
                          Tapu & Hukuki Durum
                        </button>
                        <button 
                          onClick={() => {
                            setCalcForm({
                              title: opp.title,
                              buyPrice: opp.offerPrice,
                              marketValue: opp.marketPrice,
                              expenses: 20000,
                              holdingMonths: opp.turnaroundDays / 30
                            });
                            setActiveTab('calculator');
                            showToast(`"${opp.title}" hesaplama modülüne aktarıldı.`);
                          }}
                          className="py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-emerald-400 border border-zinc-700 transition"
                        >
                          Hesapla
                        </button>
                        <button 
                          onClick={() => showToast(`"${opp.title}" için alım protokolü Telegram kanalına iletildi.`)}
                          className="py-2 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition shadow"
                        >
                          Kap
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 2. TAB: CALCULATOR */}
            {activeTab === 'calculator' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 bg-[#0B1019] border border-zinc-800 rounded-2xl p-6 space-y-4">
                  <h3 className="text-base font-bold text-white border-b border-zinc-800 pb-3 flex items-center gap-2">
                    <span>🧮</span>
                    <span>AI Arbitraj & Değerleme Hesaplayıcı</span>
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
                    <div className="md:col-span-2 space-y-1">
                      <label className="text-zinc-400">Varlık Başlığı</label>
                      <input type="text" value={calcForm.title} onChange={e => setCalcForm({...calcForm, title: e.target.value})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-400">Alış Fiyatı (₺)</label>
                      <input type="number" value={calcForm.buyPrice} onChange={e => setCalcForm({...calcForm, buyPrice: parseFloat(e.target.value) || 0})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-emerald-400 font-bold" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-400">Gerçek Piyasa Emsali (₺)</label>
                      <input type="number" value={calcForm.marketValue} onChange={e => setCalcForm({...calcForm, marketValue: parseFloat(e.target.value) || 0})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-cyan-400 font-bold" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-400">Masraflar (Tapu, Ekspertiz, Noter) (₺)</label>
                      <input type="number" value={calcForm.expenses} onChange={e => setCalcForm({...calcForm, expenses: parseFloat(e.target.value) || 0})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-400">Elden Çıkarma Süresi (Ay)</label>
                      <input type="number" step="0.5" value={calcForm.holdingMonths} onChange={e => setCalcForm({...calcForm, holdingMonths: parseFloat(e.target.value) || 1})} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-5 bg-[#0B1019] border border-zinc-800 rounded-2xl p-6 flex flex-col justify-between font-mono">
                  <div>
                    <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                      <span className="text-xs text-zinc-400">AI FİZİBİLİTE ÇIKTISI</span>
                      <span className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${calcOutput.badgeStyle}`}>{calcOutput.signal}</span>
                    </div>
                    <div className="my-5 space-y-3">
                      <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <span className="text-[10px] text-zinc-500 block">TOPLAM MALİYET</span>
                        <span className="text-base font-bold text-white">₺{calcOutput.totalCost.toLocaleString('tr-TR')}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                          <span className="text-[10px] text-zinc-500 block">NET NAKİT KÂR</span>
                          <span className="text-base font-bold text-emerald-400">₺{calcOutput.netProfit.toLocaleString('tr-TR')}</span>
                        </div>
                        <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                          <span className="text-[10px] text-zinc-500 block">DÖNGÜ GETİRİSİ</span>
                          <span className="text-base font-bold text-cyan-400">%{calcOutput.roi}</span>
                        </div>
                      </div>
                      <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <span className="text-[10px] text-zinc-500 block">YILLIKLANDIRILMIŞ HIZ</span>
                        <span className="text-sm font-bold text-amber-300">~%{calcOutput.annualizedRoi} Yıllık Bileşik Getiri</span>
                      </div>
                    </div>
                    <p className="text-xs text-zinc-300 bg-emerald-950/20 border border-emerald-800/40 p-3 rounded-xl font-sans leading-relaxed">
                      💡 {calcOutput.advice}
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* 3. TAB: FIRE */}
            {activeTab === 'fire' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-[#0C1420] to-[#0A0E18] border border-emerald-500/30 rounded-2xl p-6">
                  <h2 className="text-xl font-bold text-white">21 Yaş Düzenli Maaş + Kelepir Arbitraj Formülü</h2>
                  <p className="text-xs text-zinc-300 mt-2 leading-relaxed">
                    Memuriyetin düzenli nakit gücünü, yapay zekanın bulduğu kelepir varlıkları alıp emsalinden elden çıkararak birleştir; 30'lu yaşlara kalıcı servet ve pasif nakit akışıyla gir.
                  </p>
                </div>

                <div className="bg-[#0B1019] border border-zinc-800 rounded-2xl p-5 overflow-x-auto">
                  <table className="w-full text-left font-mono text-xs">
                    <thead>
                      <tr className="border-b border-zinc-800 text-zinc-500">
                        <th className="py-2.5 px-3">YIL</th>
                        <th className="py-2.5 px-3">YAŞ</th>
                        <th className="py-2.5 px-3">TOPLAM SERVET</th>
                        <th className="py-2.5 px-3">AYLIK PASİF GELİR</th>
                        <th className="py-2.5 px-3">STRATEJİK EVRE</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800/60">
                      {fireTimeline.map(item => (
                        <tr key={item.year} className="hover:bg-zinc-800/30">
                          <td className="py-3 px-3 font-bold text-white">Yıl {item.year}</td>
                          <td className="py-3 px-3 text-cyan-300 font-semibold">{item.age} Yaş</td>
                          <td className="py-3 px-3 text-emerald-400 font-bold text-sm">₺{item.netWorth.toLocaleString('tr-TR')}</td>
                          <td className="py-3 px-3 text-slate-200">₺{item.monthlyPassive.toLocaleString('tr-TR')}/ay</td>
                          <td className="py-3 px-3 text-zinc-400">
                            {item.netWorth > 20000000 ? '🔥 Finansal Bağımsızlık & Kalıcı Miras' : item.netWorth > 5000000 ? '🌾 Arsa & Mülk Biriktirme' : '🚗 Kelepir Araç & Arsa Flip'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. TAB: DAEMON */}
            {activeTab === 'daemon' && (
              <div className="bg-[#0B1019] border border-zinc-800 rounded-2xl p-6 font-mono text-xs space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <span className="font-bold text-emerald-400">VPS DAEMON DURUMU</span>
                  <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30">alpharadar.service: RUNNING</span>
                </div>
                <p className="text-zinc-400 font-sans">
                  DigitalOcean Ubuntu VPS üzerinde 7/24 çalışan asenkron Python motoru, internetteki fiyat anomalilerini saniyelik olarak tarayıp Telegram botuna iletmektedir.
                </p>
                <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 text-zinc-300">
                  <span className="text-zinc-500 block mb-2"># Sunucu Durum Komutu:</span>
                  <code className="text-cyan-400">sudo systemctl status alpharadar.service</code>
                </div>
              </div>
            )}

          </main>

          {/* DETAIL MODAL */}
          {selectedOpp && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#0B1019] border border-emerald-500/40 rounded-2xl max-w-xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <span className="text-xs font-mono text-emerald-400">{selectedOpp.categoryName} • {selectedOpp.city}</span>
                  <button onClick={() => setSelectedOpp(null)} className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">Kapat</button>
                </div>
                <h3 className="text-base font-bold text-white">{selectedOpp.title}</h3>
                <div className="bg-zinc-900/60 p-3.5 rounded-xl border border-zinc-800 text-xs text-zinc-300 space-y-2">
                  <p><strong className="text-white">Tapu & Hukuki Durum:</strong> {selectedOpp.tramerLegal}</p>
                  <p><strong className="text-white">Kaynak:</strong> {selectedOpp.source}</p>
                </div>
                <button 
                  onClick={() => {
                    showToast('İhale dosyası takibe alındı.');
                    setSelectedOpp(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white"
                >
                  Takibe Al & Telegram Bildirimi Aç
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-zinc-800/80 bg-[#06080D] py-6 px-4 text-center text-xs font-mono text-zinc-500">
            ALPHA RADAR &copy; 2026 | Milli Finansal İstihbarat & Kriz Arbitraj Karargahı
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AlphaRadarApp />);
  </script>
</body>
</html>
