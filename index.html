<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPHA RADAR | Finansal İstihbarat Karargahı</title>
  <!-- Tailwind CSS CDN (Derleme gerektirmez) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Lucide Icons -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#06080D] text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [city, setCity] = useState('Tümü');
      const [filter, setFilter] = useState(15);

      const items = [
        { id: 1, title: '4.850 m² Müstakil Parsel Kadastro Yollu Tarla', city: 'Samsun', district: 'Vezirköprü', price: 540000, market: 820000, discount: 34, tag: 'ACİL MİRAS' },
        { id: 2, title: '2022 Renault Megane 1.3 TCe Touch EDC', city: 'Samsun', district: 'İlkadım', price: 890000, market: 1080000, discount: 18, tag: 'NAKİT SIKIŞIKLIĞI' },
        { id: 3, title: 'UYAP e-Satış 3+1 140 m² Ara Kat Daire', city: 'Adana', district: 'Çukurova', price: 1650000, market: 2450000, discount: 33, tag: 'İCRA İHALESİ' },
        { id: 4, title: '2021 Fiat Egea 1.4 Fire Manuel', city: 'Ankara', district: 'Etimesgut', price: 535000, market: 650000, discount: 18, tag: 'FİLO ÇIKIŞI' }
      ];

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto space-y-6">
          {/* Header */}
          <header className="border-b border-zinc-800 pb-5 flex flex-wrap justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <h1 className="text-xl md:text-2xl font-black tracking-wider text-emerald-400">ALPHA RADAR v2.0</h1>
              </div>
              <p className="text-xs text-zinc-400 mt-1">81 İl Canlı Kelepir İstihbarat & Kriz Arbitraj Motoru</p>
            </div>
            <div className="bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-mono">
              <span className="text-zinc-500">DURUM: </span>
              <span className="text-emerald-400 font-bold">7/24 NÖBETTE (VPS AKTİF)</span>
            </div>
          </header>

          {/* Filtre */}
          <div className="bg-zinc-900/60 border border-zinc-800 p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between text-xs font-mono">
            <div>
              <label className="text-zinc-400 block mb-1">HEDEF İL</label>
              <select value={city} onChange={e => setCity(e.target.value)} className="bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-white">
                <option value="Tümü">Tüm Türkiye</option>
                <option value="Samsun">Samsun</option>
                <option value="Adana">Adana</option>
                <option value="Ankara">Ankara</option>
                <option value="Antalya">Antalya</option>
              </select>
            </div>
            <div>
              <label className="text-zinc-400 block mb-1">MİN. İSKONTO: %{filter}</label>
              <input type="range" min="10" max="40" value={filter} onChange={e => setFilter(e.target.value)} className="accent-emerald-500" />
            </div>
          </div>

          {/* İlan Akışı */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {items.filter(i => (city === 'Tümü' || i.city === city) && i.discount >= filter).map(item => (
              <div key={item.id} className="bg-[#0C111A] border border-zinc-800 p-5 rounded-2xl hover:border-emerald-500/50 transition flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center text-[10px] font-mono mb-2">
                    <span className="text-zinc-400">{item.city} / {item.district}</span>
                    <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/40">-%{item.discount} İSKONTO</span>
                  </div>
                  <h3 className="text-base font-bold text-white mb-2">{item.title}</h3>
                </div>
                <div className="bg-zinc-950/80 p-3 rounded-xl border border-zinc-850 flex justify-between items-center font-mono mt-3">
                  <div>
                    <span className="text-[10px] text-zinc-500 block line-through">₺{item.market.toLocaleString('tr-TR')}</span>
                    <span className="text-sm font-bold text-emerald-400">₺{item.price.toLocaleString('tr-TR')}</span>
                  </div>
                  <span className="text-xs text-amber-400 font-bold">Kâr: +₺{(item.market - item.price).toLocaleString('tr-TR')}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
